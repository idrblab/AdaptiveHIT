# Conda environment for meta_learner/ and data_adapter/ (training + inference
# of the MetaLearner ensemble, plus the data-format-adapter scripts).
#
# Each base_model/* submodule has its own separate environment (see its own
# README/environment.yml) -- they are invoked as independent processes via
# pipeline/*.sh, never imported into this environment.
#
# Setup:
#   conda env create -f environment.yml
#   conda activate adaptivehit

name: adaptivehit

channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults

dependencies:
  - python=3.10
  - pip

  # ── Scientific stack ──────────────────────────────────────────────────────
  - numpy>=1.24,<2.0
  - scipy
  - pandas>=2.0
  - scikit-learn

  # ── Chemistry ─────────────────────────────────────────────────────────────
  - rdkit

  # ── Runtime utils ─────────────────────────────────────────────────────────
  - tqdm

  # ── Deep learning ─────────────────────────────────────────────────────────
  # CUDA build: ESM-2 3B protein embeddings (_ForFeatures/esm2/main_gpu.py) are
  # the heaviest step in the pipeline and are impractical on CPU, and the
  # AdaptiveHIT model itself trains here too. cuda 12.1 covers Pascal through
  # Hopper (sm_90). With no GPU, or on Blackwell (sm_120, needs a cu128 build),
  # replace the pytorch-cuda line -- `pytorch::cpuonly` for CPU, or see
  # https://pytorch.org/get-started/locally/ for a different CUDA version.
  - pytorch::pytorch
  - pytorch::pytorch-cuda=12.1

  - pip:
    - fair-esm==2.0.0   # ESM-2 protein embeddings (embedding generation only)
